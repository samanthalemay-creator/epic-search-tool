<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAL PT Widget 2.0</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#23304a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:16px}header,.line,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:21px;margin:4px 0}p{line-height:1.45}button,input,select,textarea{font:inherit}button{border:1px solid #c9d4e5;border-radius:8px;background:white;padding:8px 10px;cursor:pointer}button.primary{background:#304296;color:white}button.active{background:#e0ebff;border-color:#304296}input,select,textarea{border:1px solid #bdc9db;border-radius:8px;padding:10px;width:100%}textarea{min-height:150px;resize:vertical}.panel,.item{background:white;border:1px solid #dce3ef;border-radius:12px;padding:14px;margin-top:12px}.line>*{flex:1}.actions>*{flex:none}.hint{font-size:12px;color:#58677d}.item h2{font-size:15px;margin:0;color:#304296;overflow-wrap:anywhere}.item pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 Segoe UI,Arial,sans-serif;max-height:90px;overflow:hidden}.item.open pre{max-height:none}.tag{font-size:11px;background:#e9f4fa;padding:4px 8px;border-radius:12px}.hidden{display:none!important}#status{font-size:13px;color:#304296;margin-top:8px}dialog{width:min(650px,96vw);border:0;border-radius:14px;padding:20px;box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0007}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}.widget .wrap{max-width:430px;padding:8px}.widget header h1{font-size:17px}.widget .hide-compact{display:none!important}.widget .panel,.widget .item{padding:10px;margin-top:8px}.widget .item pre{max-height:52px}.widget .item.open pre{max-height:none}.widget button{padding:6px 8px;font-size:12px}.widget .actions{gap:5px}#results{margin-bottom:35px}
</style></head><body><div class="wrap"><header><div><h1>SAL PT SmartPhrase Manager 2.0</h1><span class="hint">Shared browser library with your original search tool</span></div><div class="actions"><button id="mode">Compact mode</button><a href="./" class="hint">Original library</a></div></header>
<section class="panel"><input id="query" type="search" placeholder="Search phrase, activity, goal, body region..."><div class="line" style="margin-top:9px"><select id="type"><option value="">All types</option><option>SmartPhrase</option><option>SmartList</option></select><select id="region"><option value="">All regions</option><option>Cervical</option><option>Shoulder</option><option>Thoracic</option><option>Lumbar</option><option>Hip</option><option>Knee</option><option>Ankle</option><option>Pelvic</option><option>Gait</option><option>Balance</option><option>Acute</option></select></div><div class="actions" style="margin-top:10px"><button id="fav">☆ Favorites</button><button id="new" class="primary">+ Build entry</button><button id="salfp">SALFP Library</button><button id="goal">Find matching goals</button><button id="recent">Recently used</button></div><div class="actions hide-compact" style="margin-top:9px"><button id="excel-export">Export Excel</button><button id="excel-import">Import Excel / CSV</button><input type="file" id="excel-file" accept=".xlsx,.xls,.csv" class="hidden"><button id="backup">Backup JSON</button><button id="import">Import JSON</button><input type="file" id="file" accept=".json" class="hidden"><button id="clear">Clear filters</button></div><div id="status" role="status" aria-live="polite"></div></section><div id="count" class="hint" style="margin-top:10px"></div><div id="results"></div><p class="hint hide-compact">Generic documentation only — never enter patient information. This tool does not connect to Epic. Back up your library regularly. Browser storage is device-specific.</p></div>
<dialog id="editor"><form id="form"><h2 id="editor-title">Build entry</h2><label>Type</label><select id="edit-type"><option>SmartPhrase</option><option>SmartList</option></select><label>Trigger / name</label><input id="edit-name" required maxlength="250" placeholder="SALGOALSKNEE"><label>Full phrase text / SmartList options</label><textarea id="edit-text" required placeholder="Enter full text; one SmartList option per line if applicable"></textarea><label>Epic SmartList reference (optional)</label><input id="edit-ref" placeholder="{salexample:####}"><div class="actions" style="margin-top:15px"><button type="button" id="insert-ref">Insert reference</button><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save entry</button></div></form></dialog>
<script>
(()=>{'use strict';const KEY='epic-documentation-library-v1',RECENT='sal-pt-widget-recent-v1';let data=[],edit=null,favs=false,goals=false,recent=false,salfp=false;const $=id=>document.getElementById(id);function msg(s){$('status').textContent=s}function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(v)?v:[]}catch{data=[];msg('Could not read browser data.')}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch{msg('Save failed; export a backup.')}}function history(){try{return JSON.parse(localStorage.getItem(RECENT)||'[]')}catch{return []}}function used(e){let k=e.type+'|'+e.trigger;try{localStorage.setItem(RECENT,JSON.stringify([k,...history().filter(x=>x!==k)].slice(0,30)))}catch{}}function makeButton(s,fn){let b=document.createElement('button');b.textContent=s;b.onclick=fn;return b}async function copy(s,e){try{await navigator.clipboard.writeText(s);used(e);msg('Copied.')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy');used(e);msg('Copied.')}catch{msg('Copy unavailable; select text manually.')}t.remove()}}function render(){let q=$('query').value.toLowerCase().trim(),t=$('type').value,r=$('region').value.toLowerCase(),h=history();let list=data.filter(e=>(!t||e.type===t)&&(!favs||e.favorite)&&(!recent||h.includes(e.type+'|'+e.trigger))&&(!r||[e.trigger,e.content,e.reference].join(' ').toLowerCase().includes(r))&&(!q||[e.type,e.trigger,e.content,e.reference].join(' ').toLowerCase().includes(q))&&(!goals||/goal/i.test(e.trigger+' '+e.content))&&(!salfp||/^\\.?SALFP/i.test(e.trigger)||/\\{SALFP[A-Z0-9_]*(?::[^}]*)?\\}/i.test(e.content)||/\\{SALFP[A-Z0-9_]*(?::[^}]*)?\\}/i.test(e.reference)));list.sort((a,b)=>recent?h.indexOf(a.type+'|'+a.trigger)-h.indexOf(b.type+'|'+b.trigger):a.trigger.localeCompare(b.trigger));$('count').textContent='Showing '+list.length+' of '+data.length+' entries';$('salfp').classList.toggle('active',salfp);$('fav').classList.toggle('active',favs);$('goal').classList.toggle('active',goals);$('recent').classList.toggle('active',recent);let root=$('results');root.replaceChildren();if(!list.length){let p=document.createElement('p');p.className='hint';p.textContent='No matching entries. Try a different search, or add an entry.';root.append(p)}for(let e of list){let card=document.createElement('article');card.className='item';let line=document.createElement('div');line.className='line';let name=document.createElement('h2');name.textContent=e.trigger;let tag=document.createElement('span');tag.className='tag';tag.textContent=e.type;line.append(name,tag);let pre=document.createElement('pre');pre.textContent=e.content;let ref=document.createElement('div');ref.className='hint';ref.textContent=e.reference||'';if(salfp&&e.type==='SmartList'){pre.style.maxHeight='none';card.classList.add('open')}let actions=document.createElement('div');actions.className='actions';actions.append(makeButton('Copy trigger',()=>copy(e.trigger,e)),makeButton('Copy text',()=>copy(e.content,e)),makeButton(e.favorite?'★':'☆',()=>{e.favorite=!e.favorite;save()}),makeButton('More',()=>card.classList.toggle('open')),makeButton('Edit',()=>openEditor(e)));if(e.reference)actions.append(makeButton('Copy ref',()=>copy(e.reference,e)));if(salfp&&e.type==='SmartList')actions.append(makeButton('Copy options',()=>copy(e.content,e)));card.append(line,pre,ref,actions);root.append(card)}}function openEditor(e){edit=e||null;$('editor-title').textContent=e?'Edit entry':'Build entry';$('edit-type').value=e?.type||'SmartPhrase';$('edit-name').value=e?.trigger||'';$('edit-text').value=e?.content||'';$('edit-ref').value=e?.reference||'';$('editor').showModal()}$('form').onsubmit=ev=>{ev.preventDefault();let o={type:$('edit-type').value,trigger:$('edit-name').value.trim(),content:$('edit-text').value,reference:$('edit-ref').value.trim(),updated:Date.now(),favorite:edit?.favorite||false};if(!o.trigger||!o.content.trim())return;if(data.some(x=>x!==edit&&x.type.toLowerCase()===o.type.toLowerCase()&&x.trigger.toLowerCase()===o.trigger.toLowerCase())){msg('Duplicate type + trigger; edit the existing entry.');return}if(edit)data[data.indexOf(edit)]=o;else data.push(o);$('editor').close();save();msg('Entry saved locally.')} ;$('insert-ref').onclick=()=>{let s=prompt('SmartList reference to insert (example: {salexample:####})');if(s){let el=$('edit-text'),i=el.selectionStart;el.value=el.value.slice(0,i)+s+el.value.slice(el.selectionEnd);el.focus();el.setSelectionRange(i+s.length,i+s.length)}};$('cancel').onclick=()=>$('editor').close();$('new').onclick=()=>openEditor();$('query').oninput=render;$('type').onchange=render;$('region').onchange=render;$('fav').onclick=()=>{favs=!favs;render()};$('salfp').onclick=()=>{salfp=!salfp;render();msg(salfp?'Showing SALFP entries in your imported library. Search activities to narrow results.':'SALFP filter off.')};$('goal').onclick=()=>{goals=!goals;render()};$('recent').onclick=()=>{recent=!recent;render()};$('mode').onclick=()=>{document.body.classList.toggle('widget');$('mode').textContent=document.body.classList.contains('widget')?'Full mode':'Compact mode'};$('clear').onclick=()=>{$('query').value='';$('type').value='';$('region').value='';favs=goals=recent=salfp=false;render()};function download(s,n){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download(JSON.stringify(data,null,2),'sal-pt-library-backup.json');$('import').onclick=()=>$('file').click();$('file').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(e=>e&&['SmartPhrase','SmartList'].includes(e.type)&&typeof e.trigger==='string'&&typeof e.content==='string'))throw Error('Invalid library JSON');if(!confirm('Merge '+v.length+' entries into your existing browser library? Existing matching entries will be preserved. Back up first.'))return;let keys=new Set(data.map(e=>e.type.toLowerCase()+'|'+e.trigger.toLowerCase()));let added=0;for(let e of v){let k=e.type.toLowerCase()+'|'+e.trigger.toLowerCase();if(!keys.has(k)){data.push(e);keys.add(k);added++}}save();msg('Imported '+added+' new entries.')}catch(err){msg('Import failed: '+err.message)}finally{ev.target.value=''}};function excelRows(){return data.map(e=>({'Type':e.type,'Trigger / Name':e.trigger,'Description / Full Text':e.content,'Epic SmartList Reference':e.reference||''}))}function exportExcel(){if(typeof XLSX==='undefined'){msg('Excel library could not load. Check your connection.');return}let ws=XLSX.utils.json_to_sheet(excelRows(),{header:['Type','Trigger / Name','Description / Full Text','Epic SmartList Reference']});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Master Database');XLSX.writeFile(wb,'SAL_PT_SmartPhrase_Library.xlsx')}function parseExcel(rows){let names=Object.keys(rows[0]||{}),find=opts=>names.find(c=>opts.includes(c.toLowerCase().replace(/[^a-z0-9]/g,'')));let t=find(['type','smartlistorsmartphrase']),n=find(['triggername','trigger','name','dotphrase','meditechtrigger']),c=find(['descriptionfulltext','descriptioncontent','fulltext','currenttext','fulldescription','content']),ref=find(['epicsmartlistreference','smartlistreference','epicreference','smartlistid','reference']);if(!t||!n||!c)throw Error('Required columns: Type, Trigger / Name, Description / Full Text');let result=[],seen=new Set();for(let row of rows){let type=String(row[t]||'').trim().toLowerCase(),trigger=String(row[n]||'').trim(),content=String(row[c]??'');if(type==='dotphrase'||type==='smartphrase')type='SmartPhrase';else if(type==='smartlist')type='SmartList';else continue;if(!trigger||!content.trim())continue;let key=type.toLowerCase()+'|'+trigger.toLowerCase();if(seen.has(key))continue;seen.add(key);result.push({type,trigger,content,reference:ref?String(row[ref]??'').trim():'',updated:Date.now(),favorite:false})}if(!result.length)throw Error('No valid entries found');return result}function mergeExcel(incoming){let old=new Map(data.map(e=>[e.type.toLowerCase()+'|'+e.trigger.toLowerCase(),e]));let matched=incoming.filter(e=>old.has(e.type.toLowerCase()+'|'+e.trigger.toLowerCase())).length;let action=prompt('Found '+incoming.length+' valid entries, including '+matched+' matches. Type MERGE to update matching entries and keep the rest, ADD to only add new entries, or REPLACE to replace the entire database. Cancel to leave unchanged. Back up first.','ADD');if(!action)return;action=action.trim().toUpperCase();if(!['MERGE','ADD','REPLACE'].includes(action)){msg('Import canceled: invalid action.');return}if(action==='REPLACE'&&!confirm('Replace all current entries? This cannot be undone without a backup.'))return;if(action==='REPLACE'){data=incoming.map(e=>({...e,favorite:old.get(e.type.toLowerCase()+'|'+e.trigger.toLowerCase())?.favorite||false}))}else if(action==='MERGE'){let merged=new Map(old);for(let e of incoming){let key=e.type.toLowerCase()+'|'+e.trigger.toLowerCase();merged.set(key,{...e,favorite:old.get(key)?.favorite||false})}data=[...merged.values()]}else{for(let e of incoming){let key=e.type.toLowerCase()+'|'+e.trigger.toLowerCase();if(!old.has(key)){data.push(e);old.set(key,e)}}}save();msg('Excel import completed: '+action.toLowerCase()+'. '+data.length+' entries in library.')} $('excel-export').onclick=exportExcel;$('excel-import').onclick=()=>$('excel-file').click();$('excel-file').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{if(typeof XLSX==='undefined')throw Error('Excel parser unavailable. Check your connection.');let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellText:true});let sheet=wb.Sheets[wb.SheetNames.find(x=>/master|database|cheat/i.test(x))||wb.SheetNames[0]];mergeExcel(parseExcel(XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false})))}catch(err){msg('Excel import failed: '+err.message)}finally{ev.target.value=''}};window.addEventListener('storage',ev=>{if(ev.key===KEY){load();render()}});load();render()})();
</script></body></html>
